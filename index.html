<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>%SITE_NAME%: interactive websites with living scenes</title>
    <meta
      name="description"
      content="%SITE_NAME% is a fictional studio for interactive websites, shown through a living WebGL desert that stays fast on every phone. A portfolio project by Mostafa Saafan."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="/src/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/src/fonts/instrument-sans-latin-wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body class="flex min-h-dvh flex-col bg-neutral-950 font-sans text-neutral-100 antialiased">
    <!--
      Decorative. The poster is the scene's first frame (pnpm poster), shown at once; the live
      scene's canvas is added on top after the page has loaded and fades in over it.
    -->
    <div data-scene class="group fixed inset-0" aria-hidden="true">
      <picture>
        <source
          media="(max-aspect-ratio: 1/1)"
          type="image/webp"
          srcset="
            /src/poster/poster-portrait-430.webp 430w,
            /src/poster/poster-portrait-860.webp 860w
          "
          sizes="100vw"
        />
        <img
          src="/src/poster/poster-landscape-1440.webp"
          srcset="
            /src/poster/poster-landscape-1440.webp 1440w,
            /src/poster/poster-landscape-2048.webp 2048w,
            /src/poster/poster-landscape-2880.webp 2880w
          "
          sizes="100vw"
          alt=""
          fetchpriority="low"
          class="absolute inset-0 size-full object-cover"
        />
      </picture>
    </div>
    <!-- The text sits in the sky, above the dunes; the footer sits on a dark wash over the sand. -->
    <main class="relative flex-1">
      <section
        aria-labelledby="studio-name"
        class="text-scrim relative isolate max-w-xl px-6 pt-14 sm:px-10 md:pt-20 lg:px-16"
      >
        <h1
          id="studio-name"
          class="text-6xl font-semibold tracking-tight text-neutral-50 md:text-7xl"
        >
          %SITE_NAME%
        </h1>
        <p
          class="mt-4 max-w-[30ch] text-lg leading-relaxed text-pretty text-neutral-200 md:text-xl"
        >
          Interactive websites and living, generative scenes, built to stay fast on every phone.
        </p>
        <nav aria-label="Elsewhere" class="mt-8 flex flex-wrap items-center gap-x-6 gap-y-3">
          <a
            href="https://github.com/MostafaSaafan5517/sahra"
            class="rounded-sm text-neutral-100 underline decoration-neutral-500 underline-offset-4 transition-colors hover:text-accent hover:decoration-accent focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent"
            >Source on GitHub</a
          >
          <a
            href="https://www.upwork.com/freelancers/~0104fa36ecdc4bf8a1"
            class="rounded-sm text-neutral-100 underline decoration-neutral-500 underline-offset-4 transition-colors hover:text-accent hover:decoration-accent focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent"
            >Upwork profile</a
          >
        </nav>
      </section>
    </main>
    <footer
      class="relative bg-linear-to-t from-neutral-950/90 via-neutral-950/60 to-transparent px-6 pt-20 pb-6 text-sm text-neutral-300 sm:px-10 lg:px-16"
    >
      <p>%SITE_NAME% is a fictional studio, made as a portfolio project by Mostafa Saafan.</p>
    </footer>
  </body>
</html>
